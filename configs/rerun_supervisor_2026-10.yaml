# Re-run after the supervisor feedback of 2026-10-08 (run WITHOUT --skip-existing; new run dirs, `latest` moves):
#   * image codebook K=512 -> 1,024 (image_vq, image_vq_vanilla) and every downstream run that uses it;
#   * image downstream selected on AUROC (blood / derma were selected on accuracy);
#   * templated notes v2 (negation, times, version tag) -> text BPE refitted by `prepare`, interfaces + text task;
#   * protocol-overhead compression ratio -> every main tokenizer re-evaluated.
# Image steps first so the week-2 results are ready earliest.
output_dir: experiments
steps:
  - {train: configs/image_vq.yaml, evaluate_after: true}
  - {train: configs/image_vq_vanilla.yaml, evaluate_after: true}
  - {evaluate: experiments/image_continuous}
  - {downstream: configs/downstream/pneumoniamnist_vq.yaml}
  - {downstream: configs/downstream/bloodmnist_vq.yaml}
  - {downstream: configs/downstream/bloodmnist_continuous.yaml}
  - {downstream: configs/downstream/dermamnist_vq.yaml}
  - {downstream: configs/downstream/dermamnist_continuous.yaml}
  - {report: true}
  - {interfaces: true}
  - {evaluate: experiments/timeseries_continuous}
  - {evaluate: experiments/timeseries_vq}
  - {evaluate: experiments/timeseries_event}
  - {evaluate: experiments/timeseries_event_change}
  - {evaluate: experiments/video_continuous}
  - {evaluate: experiments/video_vq}
  - {evaluate: experiments/video_segments}
  - {downstream: configs/downstream/mortality_event_text.yaml}
  - {downstream: configs/downstream/multitask_vq.yaml}
  - {report: true}
