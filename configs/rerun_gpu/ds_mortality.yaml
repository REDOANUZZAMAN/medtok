steps:
  - {downstream: configs/downstream/mortality_continuous.yaml}
  - {downstream: configs/downstream/mortality_vq.yaml}
  - {downstream: configs/downstream/mortality_event.yaml}
  - {downstream: configs/downstream/mortality_event_change.yaml}
  - {downstream: configs/downstream/mortality_event_text.yaml}
