[project]
name = "medtok"
version = "0.1.0"
description = "Medical multimodal tokenizer and unified token protocol (text, 2D imaging, physiological time-series; interfaces for surgical video and 3D point clouds)"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy", "scipy", "scikit-learn", "pandas", "tqdm", "pyyaml", "tokenizers", "medmnist", "matplotlib"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
